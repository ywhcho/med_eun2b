{% extends 'base.html' %}

{% block title %}게시글 삭제 - 의약품 정보 관리 시스템{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">게시글 삭제</h4>
            </div>
            <div class="card-body">
                <p class="mb-3">정말로 이 게시글을 삭제하시겠습니까?</p>
                <div class="alert alert-warning">
                    <strong>{{ post.title }}</strong>
                </div>
                <p class="text-muted">이 작업은 되돌릴 수 없습니다.</p>
                
                <form method="post" class="d-flex justify-content-between">
                    {% csrf_token %}
                    <a href="{% url 'board:detail' post.pk %}" class="btn btn-secondary">취소</a>
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
